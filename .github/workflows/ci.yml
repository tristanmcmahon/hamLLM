name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pytest ruff==0.16.8
      - run: ruff check --select F,E9,B,SIM src tests scripts
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - run: |
          hamllm --version
          hamllm --help
          hamllm run --help
          hamllm models --help
          hamllm doctor --help
          hamllm eval --help
          hamllm resolve --help
          hamllm mcp --help
          python -m hamllm --version
      - name: MCP stdio smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | hamllm mcp | python -c "import json,sys; r=[json.loads(l) for l in sys.stdin]; assert [x['id'] for x in r]==[1,2], r; print('ok')"
