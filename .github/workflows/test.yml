name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Install package
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          hamllm --version
          hamllm --help
          hamllm run --help
          hamllm chat --help
          hamllm models --help
          hamllm doctor --help
          python -m hamllm --version
